services:
  wallboard:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      PORT: "3001"
    volumes:
      - wallboard-tokens:/app/apps/api/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  wallboard-tokens:
